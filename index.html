<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BugBoard · Advantage Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4EFE3;
    --paper-dim:#ECE5D3;
    --ink:#221F1A;
    --ink-soft:#5B564C;
    --brass:#A9812F;
    --brass-dim:#D8C48F;
    --mint:#5E8F79;
    --mint-dim:#D7E6DE;
    --rust:#A6432E;
    --rust-dim:#EFD6CD;
    --line:rgba(34,31,26,0.14);
    --card:#FFFDF8;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Header + ruler-tick motif ---------- */
  header.app-header{
    background:var(--ink);
    color:var(--paper);
    padding:22px 28px 0;
  }
  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    max-width:1280px;
    margin:0 auto;
    padding-bottom:16px;
  }
  .brand h1{
    font-size:26px;
    margin:0;
    letter-spacing:0.5px;
    font-weight:700;
  }
  .brand p{
    margin:4px 0 0;
    font-size:12.5px;
    color:var(--brass-dim);
    font-family:'IBM Plex Mono',monospace;
  }
  .header-actions{display:flex;align-items:center;gap:14px;}
  .sync-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:5px 10px;
    border-radius:20px;
    border:1px solid rgba(244,239,227,0.25);
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--paper);
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);}
  .sync-dot.offline{background:var(--rust);}
  .sync-dot.busy{background:var(--brass);}
  .btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13.5px;
    border:none;
    border-radius:var(--radius);
    padding:10px 16px;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--brass);color:#221F1A;}
  .btn-primary:hover{background:var(--brass-dim);}
  .btn-ghost{background:transparent;color:var(--paper);border:1px solid rgba(244,239,227,0.3);}
  .btn-ghost:hover{border-color:var(--paper);}
  .ruler{
    height:14px;
    max-width:1280px;
    margin:0 auto;
    background-image:
      repeating-linear-gradient(90deg, rgba(244,239,227,0.55) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(90deg, rgba(244,239,227,0.9) 0 1px, transparent 1px 40px);
    background-size: 8px 7px, 40px 14px;
    background-position: bottom left, bottom left;
    background-repeat: repeat-x;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1280px;
    margin:20px auto 0;
    padding:0 28px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  select, input[type=text]{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    border-radius:var(--radius);
  }
  input[type=text]{min-width:200px;flex:1;}
  .toolbar-spacer{flex:1;}
  .count-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }

  /* ---------- Board ---------- */
  main{max-width:1280px;margin:0 auto;padding:16px 28px 60px;}
  .board-table{width:100%;border-collapse:collapse;}
  .board-table thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  .bug-row{
    background:var(--card);
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .bug-row:hover{background:var(--paper-dim);}
  .bug-row td{padding:12px 10px;font-size:13.5px;vertical-align:top;}
  .bug-id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .bug-mod{font-weight:600;}
  .bug-sub{color:var(--ink-soft);font-size:12.5px;}
  .badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.3px;
    padding:3px 8px;
    border-radius:20px;
  }
  .sev-critical{background:var(--rust-dim);color:var(--rust);}
  .sev-high{background:#F4E1C6;color:#8A5A16;}
  .sev-medium{background:var(--brass-dim);color:#6E5518;}
  .sev-low{background:var(--mint-dim);color:var(--mint);}
  .status-select{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:4px 6px;
    border-radius:var(--radius);
    border:1px solid var(--line);
  }
  .thumb{
    width:36px;height:36px;border-radius:3px;object-fit:cover;
    border:1px solid var(--line);
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(34,31,26,0.5);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper);
    width:100%;max-width:560px;
    max-height:90vh;overflow-y:auto;
    border-radius:4px;
    border:1px solid var(--line);
  }
  .modal-head{
    padding:18px 22px;
    border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h2{margin:0;font-size:17px;}
  .modal-close{cursor:pointer;font-size:20px;background:none;border:none;color:var(--ink-soft);}
  .modal-body{padding:20px 22px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.3px;
  }
  .field select,.field input,.field textarea{
    width:100%;font-family:'Space Grotesk',sans-serif;font-size:14px;
    padding:10px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);color:var(--ink);
  }
  .field textarea{font-family:'Space Grotesk',sans-serif;min-height:90px;resize:vertical;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  .screenshot-preview{max-width:100%;border-radius:3px;margin-top:8px;border:1px solid var(--line);}
  .detail-desc{white-space:pre-wrap;font-size:14px;line-height:1.5;margin:0 0 14px;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .meta-item{font-size:12.5px;}
  .meta-item span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-bottom:2px;}
  .helper-text{font-size:11px;color:var(--ink-soft);margin-top:4px;font-family:'IBM Plex Mono',monospace;}

  @media (max-width:640px){
    .two-col,.meta-grid{grid-template-columns:1fr;}
    .board-table thead{display:none;}
    .board-table, .board-table tbody, .bug-row, .bug-row td{display:block;width:100%;}
    .bug-row{padding:10px 0;}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <h1>BugBoard</h1>
      <p>ADVANTAGE FOODS · ISSUE TRACKER</p>
    </div>
    <div class="header-actions">
      <div class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">connecting…</span></div>
      <button class="btn btn-ghost" id="refreshBtn">Refresh</button>
      <button class="btn btn-primary" id="newBugBtn">+ Report bug</button>
    </div>
  </div>
  <div class="ruler"></div>
</header>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search description, module, reporter…">
  <select id="filterModule"><option value="">All modules</option></select>
  <select id="filterSeverity">
    <option value="">All severities</option>
    <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
  </select>
  <select id="filterStatus">
    <option value="">All statuses</option>
    <option>Open</option><option>In Progress</option><option>Resolved</option><option>Won't Fix</option>
  </select>
  <div class="toolbar-spacer"></div>
  <span class="count-tag" id="countTag">0 bugs</span>
</div>

<main>
  <table class="board-table">
    <thead>
      <tr>
        <th></th>
        <th>ID</th>
        <th>Module</th>
        <th>Severity</th>
        <th>Status</th>
        <th>Reporter</th>
        <th>Reported</th>
      </tr>
    </thead>
    <tbody id="boardBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none;">No bugs match these filters yet.</div>
</main>

<!-- Report Bug Modal -->
<div class="overlay" id="newBugOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Report a bug</h2>
      <button class="modal-close" data-close="newBugOverlay">&times;</button>
    </div>
    <div class="modal-body">
      <div class="two-col">
        <div class="field">
          <label>Module</label>
          <select id="inputModule"></select>
        </div>
        <div class="field">
          <label>Submodule</label>
          <select id="inputSubmodule"></select>
        </div>
      </div>
      <div class="two-col">
        <div class="field">
          <label>Severity</label>
          <select id="inputSeverity">
            <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
          </select>
        </div>
        <div class="field">
          <label>Reporter name</label>
          <input type="text" id="inputReporter" placeholder="Your name">
        </div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="inputDescription" placeholder="What happened? Steps to reproduce, what you expected…"></textarea>
      </div>
      <div class="field">
        <label>Screenshot (optional)</label>
        <input type="file" id="inputScreenshot" accept="image/*">
        <img id="screenshotPreview" class="screenshot-preview" style="display:none;">
        <div class="helper-text">Resized client-side before upload to Google Drive.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" style="color:var(--ink);border-color:var(--line);" data-close="newBugOverlay">Cancel</button>
      <button class="btn btn-primary" id="submitBugBtn">Submit bug</button>
    </div>
  </div>
</div>

<!-- Bug Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="detailTitle">Bug detail</h2>
      <button class="modal-close" data-close="detailOverlay">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <label style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);align-self:center;margin-right:auto;">Status</label>
      <select class="status-select" id="detailStatusSelect">
        <option>Open</option><option>In Progress</option><option>Resolved</option><option>Won't Fix</option>
      </select>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — paste your deployed Apps Script Web App URL here
   ============================================================ */
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxZOxp2keSrkhFY2QKAwZXlaLbPP5-4QZPvrYFBdvhOqei_eWuxaVW2GBf-JcCRdzEN/exec"
};

/* ============================================================
   Menu map — mirrors the WritersCafe ERP navigation
   ============================================================ */
const MENU_MAP = {
  "Home": ["Dashboard","Kitchen Dashboard","Kitchen Pickup Dashboard"],
  "POS": ["Billing","Invoices","Cake Order Book","Today's Menu","Disable Online Menu","Issue Types","Amendment Log","Issue Analytics","Combos"],
  "Location Management": ["Locations","Store Logins","Sale Channels","Channel Ordering"],
  "Purchases": ["High Price Alert","Category","Brands","Vendor Dashboard","Vendors","Manage Incoming Stocks"],
  "Inventory Management": ["Products","Outlet Inventory","End of Day Closing","Outlet Stocks History"],
  "Stock Transfer": ["Stock Transfer","Request Thresholds","Credit Wastage Stocks"],
  "Stock & Operations": ["Fast-mover Reorder","Slow Movers","Lost Sales","Low Stock Alert"],
  "Recipe Management": ["Recipe Manager","Recipe Calculator","Recipe SFG Calculator"],
  "Reports & Analytics": ["Reports","Sales Analytics","Sku Analytics","Category Analytics","Sold-Out Timing","Fulfilment Tracker"],
  "Sales Intelligence": ["Overview","Menu Performance","Cross-sell & Bundles","Peak Hours Heatmap","Pricing Nudges","Customer Segments","Sales Anomalies","Location Benchmark","Discount Impact"],
  "AI & Insights": ["AI Home","Price Trends","Sales Forecast","Wastage Insights","Buy / Pre-buy Advisor","Ask AI","Org Pulse"],
  "Marketing": ["Promotions","Campaigns"],
  "Loyalty Program": ["Loyalty Dashboard","Member Dashboard","Category Wise Analysis","SMS Viewer","Members","Earn and Burn","Repeat Purchases"],
  "User Management": ["Manage Users","Manage Roles","Emulate"],
  "Administration": ["Organizations","Application Health","Clear Cache"],
  "Settings": ["Business Settings","Jobs","Developer Settings"],
  "Support": ["Dashboard","Category","Questions"]
};

/* ============================================================
   Device-tagged ID + reporter memory (prevents collisions,
   remembers who's typing from this browser)
   ============================================================ */
function getDeviceId(){
  let id = localStorage.getItem('bugboard_device_id');
  if(!id){
    id = Math.random().toString(36).slice(2,6).toUpperCase();
    localStorage.setItem('bugboard_device_id', id);
  }
  return id;
}
function newBugId(){
  return 'BUG-' + Date.now().toString(36).toUpperCase() + '-' + getDeviceId();
}

/* ============================================================
   State
   ============================================================ */
let bugs = [];
let activeBugId = null;

const el = (id) => document.getElementById(id);

function setSync(state){
  const dot = el('syncDot'), label = el('syncLabel');
  dot.className = 'sync-dot' + (state==='offline' ? ' offline' : state==='busy' ? ' busy' : '');
  label.textContent = state==='synced' ? 'synced' : state==='offline' ? 'offline' : 'syncing…';
}

/* ============================================================
   Networking — POST uses text/plain to dodge CORS preflight
   ============================================================ */
async function fetchBugs(){
  setSync('busy');
  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, { method:'GET' });
    const data = await res.json();
    bugs = (data.bugs || []).reverse();
    setSync('synced');
    render();
  }catch(err){
    console.error(err);
    setSync('offline');
  }
}
async function postAction(payload){
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

/* ============================================================
   Populate module/submenu dropdowns
   ============================================================ */
function populateModuleSelects(){
  const modules = Object.keys(MENU_MAP);
  const filterSel = el('filterModule');
  const inputSel = el('inputModule');
  modules.forEach(m=>{
    filterSel.appendChild(new Option(m,m));
    inputSel.appendChild(new Option(m,m));
  });
  inputSel.addEventListener('change', ()=> populateSubmodules(inputSel.value));
  populateSubmodules(inputSel.value);
}
function populateSubmodules(module){
  const subSel = el('inputSubmodule');
  subSel.innerHTML = '';
  (MENU_MAP[module]||[]).forEach(s=> subSel.appendChild(new Option(s,s)));
}

/* ============================================================
   Rendering
   ============================================================ */
function severityBadge(sev){
  const cls = { Critical:'sev-critical', High:'sev-high', Medium:'sev-medium', Low:'sev-low' }[sev] || 'sev-medium';
  return `<span class="badge ${cls}">${sev}</span>`;
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short' }) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

function applyFilters(list){
  const q = el('searchInput').value.trim().toLowerCase();
  const mod = el('filterModule').value;
  const sev = el('filterSeverity').value;
  const stat = el('filterStatus').value;
  return list.filter(b=>{
    if(mod && b.Module !== mod) return false;
    if(sev && b.Severity !== sev) return false;
    if(stat && b.Status !== stat) return false;
    if(q){
      const hay = [b.Module,b.Submodule,b.Description,b.Reporter,b.ID].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const filtered = applyFilters(bugs);
  el('countTag').textContent = filtered.length + (filtered.length===1?' bug':' bugs');
  const body = el('boardBody');
  body.innerHTML = '';
  el('emptyState').style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(b=>{
    const tr = document.createElement('tr');
    tr.className = 'bug-row';
    tr.addEventListener('click', ()=> openDetail(b.ID));
    tr.innerHTML = `
      <td>${b.ScreenshotURL ? `<img class="thumb" src="${b.ScreenshotURL}">` : ''}</td>
      <td class="bug-id mono">${b.ID}</td>
      <td><div class="bug-mod">${b.Module}</div><div class="bug-sub">${b.Submodule}</div></td>
      <td>${severityBadge(b.Severity)}</td>
      <td><span class="badge" style="background:var(--paper-dim);color:var(--ink-soft);">${b.Status}</span></td>
      <td>${b.Reporter || '—'}</td>
      <td class="mono" style="font-size:11.5px;color:var(--ink-soft);">${fmtDate(b.Timestamp)}</td>
    `;
    body.appendChild(tr);
  });
}

/* ============================================================
   Detail modal
   ============================================================ */
function openDetail(id){
  const b = bugs.find(x=>x.ID===id);
  if(!b) return;
  activeBugId = id;
  el('detailTitle').textContent = b.Module + ' › ' + b.Submodule;
  el('detailBody').innerHTML = `
    <div class="meta-grid">
      <div class="meta-item"><span>ID</span><span class="mono">${b.ID}</span></div>
      <div class="meta-item"><span>Reported</span>${fmtDate(b.Timestamp)}</div>
      <div class="meta-item"><span>Reporter</span>${b.Reporter||'—'}</div>
      <div class="meta-item"><span>Severity</span>${severityBadge(b.Severity)}</div>
    </div>
    <p class="detail-desc">${(b.Description||'').replace(/</g,'&lt;')}</p>
    ${b.ScreenshotURL ? `<img class="screenshot-preview" src="${b.ScreenshotURL}">` : ''}
  `;
  el('detailStatusSelect').value = b.Status || 'Open';
  el('detailOverlay').classList.add('open');
}
el('detailStatusSelect').addEventListener('change', async (e)=>{
  const newStatus = e.target.value;
  const bug = bugs.find(x=>x.ID===activeBugId);
  if(bug) bug.Status = newStatus;
  render();
  setSync('busy');
  await postAction({ action:'update', id: activeBugId, status: newStatus });
  setSync('synced');
});

/* ============================================================
   New bug modal + screenshot handling
   ============================================================ */
let screenshotDataUrl = null;
el('inputScreenshot').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev)=>{
    img.onload = ()=>{
      const maxW = 1000;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      screenshotDataUrl = canvas.toDataURL('image/jpeg', 0.72);
      el('screenshotPreview').src = screenshotDataUrl;
      el('screenshotPreview').style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

el('submitBugBtn').addEventListener('click', async ()=>{
  const description = el('inputDescription').value.trim();
  if(!description){ el('inputDescription').focus(); return; }

  const reporter = el('inputReporter').value.trim() || 'Anonymous';
  localStorage.setItem('bugboard_reporter', reporter);

  const payload = {
    action: 'create',
    id: newBugId(),
    module: el('inputModule').value,
    submodule: el('inputSubmodule').value,
    severity: el('inputSeverity').value,
    reporter,
    deviceId: getDeviceId(),
    description,
    status: 'Open',
    screenshot: screenshotDataUrl
  };

  closeOverlay('newBugOverlay');
  resetNewBugForm();
  setSync('busy');
  const result = await postAction(payload);
  if(result.ok && result.screenshotUrl) payload.screenshotURL = result.screenshotUrl;
  await fetchBugs();
});

function resetNewBugForm(){
  el('inputDescription').value = '';
  el('inputSeverity').value = 'Medium';
  el('screenshotPreview').style.display = 'none';
  el('inputScreenshot').value = '';
  screenshotDataUrl = null;
}

/* ============================================================
   Overlay plumbing
   ============================================================ */
function closeOverlay(id){ el(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=> closeOverlay(btn.dataset.close));
});
el('newBugBtn').addEventListener('click', ()=>{
  const savedReporter = localStorage.getItem('bugboard_reporter');
  if(savedReporter) el('inputReporter').value = savedReporter;
  el('newBugOverlay').classList.add('open');
});
el('refreshBtn').addEventListener('click', fetchBugs);
['searchInput','filterModule','filterSeverity','filterStatus'].forEach(id=>{
  el(id).addEventListener('input', render);
  el(id).addEventListener('change', render);
});

/* ============================================================
   Boot
   ============================================================ */
populateModuleSelects();
fetchBugs();
setInterval(fetchBugs, 30000); // pull sync every 30s
</script>
</body>
</html>
